services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tech_hiring_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tech_hiring_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  platform-backend:
    build:
      context: ./platform-backend
    container_name: platform-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tech_hiring_db}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - FRONTEND_URL=http://localhost
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    ports:
      - "8080:8080"
    restart: unless-stopped

  media-server:
    build:
      context: ./media-server
    container_name: media-server
    environment:
      - ENABLE_RECORDING=true
      - PORT=3000
      - HOST=0.0.0.0
      - RECORDING_DIR=/app/recordings
      - MEDIASOUP_MIN_PORT=40000
      - MEDIASOUP_MAX_PORT=40200
      - RECORDER_MIN_PORT=50000
      - RECORDER_MAX_PORT=50200
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      # Set MEDIASOUP_ANNOUNCED_IP in your .env file to your machine's LAN IP.
      # Required for Docker: the container's internal IP won't work for browsers.
      # Example: MEDIASOUP_ANNOUNCED_IP=192.168.1.100
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-}
    ports:
      - "3000:3000"
      - "40000-40200:40000-40200/udp"
      - "40000-40200:40000-40200/tcp"
      - "50000-50200:50000-50200/udp"
    volumes:
      - media_recordings:/app/recordings
    restart: unless-stopped

  platform-frontend:
    build:
      context: ./platform-frontend
    container_name: platform-frontend
    ports:
      - "80:80"
    depends_on:
      - platform-backend
      - media-server
    restart: unless-stopped

volumes:
  postgres_data:
  media_recordings:
